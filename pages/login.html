<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión — Biblioteca El Sabio</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos base y de Login -->
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/login-styles.css" />
  </head>
  <body>
    <div class="login-wrapper">
      <!-- PANEL IZQUIERDO: DECORACIÓN Y BÚHO -->
      <div class="login-left-panel">
        <a href="index.html" class="back-link">← Volver al Inicio</a>

        <div class="brand-hero">
          <img
            src="../assets/img/Buho Logo.png"
            alt="Búho Sabio"
            class="hero-owl-img"
          />
          <h2>Biblioteca <span>El Sabio</span></h2>
          <p>
            Tu entrada al refugio del conocimiento. Descubre, reserva y gestiona
            lecturas en el bosque del saber.
          </p>
        </div>

        <div class="panel-footer">
          <p>© 2026 Biblioteca El Sabio</p>
        </div>
      </div>

      <!-- PANEL DERECHO: FORMULARIO DE ACCESO -->
      <div class="login-right-panel">
        <div class="login-card">
          <div class="login-header">
            <span class="badge">🦉 Acceso al Bosque</span>
            <h2 id="login-title">Iniciar Sesión</h2>
            <p id="login-subtitle">
              Ingresa tus datos para acceder a tu perfil
            </p>
          </div>

          <form id="auth-form">
            <div class="input-group">
              <label for="email">Correo Electrónico</label>
              <input
                type="email"
                id="email"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Contraseña</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="••••••••"
                  required
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="btn-toggle-password"
                  title="Mostrar contraseña"
                >
                  👁
                </button>
              </div>
            </div>

        <!-- GRUPO TIPO DE CUENTA (Oculto en inicio de sesión) -->
<div class="input-group" id="grupo-tipo-cuenta" style="display: none;">
  <label for="tipo-cuenta">Registrarse como</label>
  <select id="tipo-cuenta">
    <option value="lector">📖 Lector</option>
    <option value="admin">🔐 Administrador</option>
  </select>
</div>
            <button
              type="submit"
              id="btn-auth"
              class="btn btn-primary btn-full"
            >
              Ingresar a mi Cuenta
            </button>
          </form>

          <div class="toggle-mode">
            <p id="toggle-text">¿No tienes una cuenta aún?</p>
            <button type="button" id="btn-toggle" class="btn-link">
              Crear una cuenta nueva
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- FIREBASE AUTHENTICATION -->
   <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword 
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    setDoc, 
    getDoc 
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8Fcb60NXBVnfoIqYy903loTapqrVWc4g",
    authDomain: "mi-biblioteca-web-47e11.firebaseapp.com",
    projectId: "mi-biblioteca-web-47e11",
    storageBucket: "mi-biblioteca-web-47e11.firebasestorage.app",
    messagingSenderId: "152963035735",
    appId: "1:152963035735:web:203b25f135e75f5f8ae912"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isLogin = true;

  // Elementos DOM
  const form = document.getElementById('auth-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const tipoCuentaSelect = document.getElementById('tipo-cuenta');
  const grupoTipoCuenta = document.getElementById('grupo-tipo-cuenta');
  const loginTitle = document.getElementById('login-title');
  const loginSubtitle = document.getElementById('login-subtitle');
  const btnAuth = document.getElementById('btn-auth');
  const btnToggle = document.getElementById('btn-toggle');
  const toggleText = document.getElementById('toggle-text');
  const togglePasswordBtn = document.getElementById('toggle-password');

  // Alternar vista entre Iniciar Sesión y Crear Cuenta
  btnToggle.addEventListener('click', () => {
    isLogin = !isLogin;
    if (isLogin) {
      loginTitle.innerText = "Iniciar Sesión";
      loginSubtitle.innerText = "Ingresa tus datos para acceder a tu perfil";
      btnAuth.innerText = "Ingresar a mi Cuenta";
      toggleText.innerText = "¿No tienes una cuenta aún?";
      btnToggle.innerText = "Crear una cuenta nueva";
      grupoTipoCuenta.style.display = "none"; // Ocultar rol en login
    } else {
      loginTitle.innerText = "Crear Cuenta";
      loginSubtitle.innerText = "Regístrate para solicitar libros en la biblioteca";
      btnAuth.innerText = "Registrarse";
      toggleText.innerText = "¿Ya tienes una cuenta?";
      btnToggle.innerText = "Iniciar Sesión";
      grupoTipoCuenta.style.display = "block"; // Mostrar rol en registro
    }
  });

  // Mostrar / Ocultar contraseña
  togglePasswordBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    togglePasswordBtn.innerText = isPassword ? '🙈' : '👁️';
    togglePasswordBtn.setAttribute('title', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  // Procesar Autenticación
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const tipoCuenta = tipoCuentaSelect.value;

    try {
      if (isLogin) {
        // 1. Iniciar sesión
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // 2. Consultar rol en la colección "usuarios" de Firestore
        const userDocRef = doc(db, "usuarios", uid);
        const userDoc = await getDoc(userDocRef);

        let rol = "lector"; // Valor por defecto
        if (userDoc.exists()) {
          rol = userDoc.data().rol;
        }

        // 3. Redirección automática según el rol registrado
        if (rol === "admin") {
          window.location.href = "cuenta-admin.html";
        } else {
          window.location.href = "cuenta-lector.html";
        }

      } else {
        // 1. Crear nuevo usuario
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // 2. Guardar el rol seleccionado en Firestore
        await setDoc(doc(db, "usuarios", uid), {
          email: email,
          rol: tipoCuenta,
          fechaCreacion: new Date()
        });

        // 3. Redirección inicial
        if (tipoCuenta === "admin") {
          window.location.href = "cuenta-admin.html";
        } else {
          window.location.href = "cuenta-lector.html";
        }
      }
    } catch (error) {
      console.error("Error en autenticación:", error);
      alert("Ocurrió un error: " + error.message);
    }
  });
</script>
  </body>
</html>
